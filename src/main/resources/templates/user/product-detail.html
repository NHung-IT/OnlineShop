
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' | Online Shop'">Chi tiết sản phẩm</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8ff;
            color: #172554;
        }

        .container {
            max-width: 1150px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #dbeafe;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.06);
        }

        .product-image {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 380px;
            background: #f8fafc;
            border-radius: 14px;
            padding: 20px;
        }

        .product-image img {
            max-width: 100%;
            max-height: 380px;
            object-fit: contain;
        }

        .product-info {
            padding: 20px 0;
        }

        .product-label {
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .product-info h1 {
            margin: 15px 0;
            font-size: 30px;
            line-height: 1.4;
        }

        .price {
            margin: 25px 0;
            color: #2563eb;
            font-size: 27px;
            font-weight: 700;
        }

        .description {
            color: #64748b;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .stock {
            display: inline-block;
            padding: 10px 15px;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 20px;
            }

            .product-image {
                min-height: 260px;
            }

            .product-info h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/" class="back-link">
        ← Quay lại trang chủ
    </a>

    <div class="product-detail">

        <div class="product-image">

            <img
                th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                th:src="${product.imageUrl}"
                th:alt="${product.name}">

            <img
                th:unless="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
                src="https://placehold.co/500x400?text=No+Image"
                alt="No image">

        </div>

        <div class="product-info">

            <span class="product-label">Chi tiết sản phẩm</span>

            <h1 th:text="${product.name}">
                Tên sản phẩm
            </h1>

            <p class="price">
                <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></span>
                VND
            </p>

            <p class="description"
               th:text="${product.description != null and !product.description.isEmpty()
                    ? product.description : 'Sản phẩm hiện chưa có mô tả.'}">
                Mô tả sản phẩm
            </p>

            <div class="stock">
                Còn hàng:
                <span th:text="${product.quantity}"></span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
